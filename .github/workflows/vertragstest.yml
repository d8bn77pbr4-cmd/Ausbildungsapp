name: Vertragstest Quellen
# Prüft täglich live, ob die Schnittstellen der Bundesagentur noch so antworten wie erwartet.
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
jobs:
  vertrag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:vertrag
